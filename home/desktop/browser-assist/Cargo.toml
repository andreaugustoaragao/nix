[package]
name = "browser-assist"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native browser assistance with private inputs and screenshots"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", default-features = false, features = ["accessibility", "dbus"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
