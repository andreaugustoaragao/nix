# Propose weekly flake.lock updates for local validation before merging.
name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Mondays 08:00 UTC (01:00 America/Denver)
    - cron: "0 8 * * 1"

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            automated
