[package]
name = "cursor-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
rcgen = "0.14"
rustls-pemfile = "2"
socket2 = { version = "0.6", features = ["all"] }
