[package]
name = "browser-task"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
libc = "0.2"
rand = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
